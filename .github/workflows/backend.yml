name: stell-topia-backend

on:
  push:
    branches: ['*']
    paths:
      - "stell-topia-backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: ['*']
    paths:
      - "stell-topia-backend/**"
      - ".github/workflows/backend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stell-topia-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
