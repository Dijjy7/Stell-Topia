name: stell-topia-api

on:
  push:
    branches: ['*']
    paths:
      - "stell-topia-api/**"
  pull_request:
    branches: ['*']
    paths:
      - "stell-topia-api/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stell-topia-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: pytest
